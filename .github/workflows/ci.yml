name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  backend-quality:
    name: Backend coverage & e2e
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run backend unit coverage
        run: npm run test:cov
        continue-on-error: true

      - name: Run backend e2e tests
        run: npm run test:e2e:report
        continue-on-error: true

      - name: Publish backend quality summary
        if: always()
        run: npm run quality:report:backend

      - name: Upload backend quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-quality-reports
          path: |
            coverage/backend-unit/
            test-results/backend-*.json
            test-results/backend-summary.md
          if-no-files-found: warn

      - name: Enforce backend quality gate
        if: always()
        run: npm run quality:report:backend -- --check-only

  frontend-unit-quality:
    name: Frontend unit coverage
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install quality reporter dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run frontend lint
        id: frontend-lint
        run: npm run lint --prefix frontend
        continue-on-error: true

      - name: Run frontend unit coverage
        run: npm run frontend:test:coverage
        continue-on-error: true

      - name: Publish frontend unit quality summary
        if: always()
        run: npm run quality:report:frontend-unit

      - name: Upload frontend unit quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-unit-quality-reports
          path: |
            frontend/coverage/
            frontend/test-results/vitest-results.json
            frontend/test-results/unit-summary.*
          if-no-files-found: warn

      - name: Enforce frontend unit quality gate
        if: always()
        run: |
          npm run quality:report:frontend-unit -- --check-only
          if [ "${{ steps.frontend-lint.outcome }}" != "success" ]; then
            echo "Frontend lint failed."
            exit 1
          fi

  frontend-e2e-quality:
    name: Frontend Playwright e2e
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install quality reporter dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run frontend Playwright e2e
        run: npm run frontend:test:e2e:report
        continue-on-error: true

      - name: Publish frontend e2e quality summary
        if: always()
        run: npm run quality:report:frontend-e2e

      - name: Upload frontend e2e quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-quality-reports
          path: |
            frontend/playwright-report/
            frontend/test-results/playwright-results.json
            frontend/test-results/playwright-artifacts/
            frontend/test-results/e2e-summary.*
          if-no-files-found: warn

      - name: Enforce frontend e2e quality gate
        if: always()
        run: npm run quality:report:frontend-e2e -- --check-only

  build:
    name: Build & Upload Artifact
    runs-on: ubuntu-24.04
    needs:
      - backend-quality
      - frontend-unit-quality
      - frontend-e2e-quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build backend application
        run: npm run build

      - name: Build frontend application
        run: npm run build --prefix frontend

      - name: Upload backend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: dist/
          if-no-files-found: error

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error

      - name: Upload application package
        uses: actions/upload-artifact@v4
        with:
          name: book-library-application
          path: |
            dist/
            frontend/dist/
            package.json
            package-lock.json
            frontend/package.json
            frontend/package-lock.json
            Dockerfile
          if-no-files-found: error
