 }\n\n  onApplicationShutdown(): void {\n    this.stopped = true;\n    this.lifecycleGeneration += 1;\n    if (this.readinessProbe) {\n      clearInterval(this.readinessProbe);\n      this.readinessProbe = undefined;\n    }\n    if (\n      this.scheduled &&\n      this.schedulerRegistry?.doesExist('interval', SCHEDULE_NAME)\n    ) {\n      this.schedulerRegistry.deleteInterval(SCHEDULE_NAME);\n    }\n    this.scheduled = false;\n  }\n\n  reconcileOnce(): Promise<"+"AuthIdentifierReconciliationResult> {\n    if (!this.activeRun) {\n      this.activeRun = this.runBoundedPass().finally(() => {\n        this.activeRun = undefined;\n      });\n    }\n    return this.activeRun;\n  }\n\n  async renewLease(operationId: string): Promise<"+"boolean> {\n    const updated = await this.operationModel.findOneAndUpdate(\n      {\n        operationId,\n        leaseOwner: this.instanceId,\n        $expr: { $gt: ['$leaseExpiresAt', '$$NOW'] },\n      },\n      [\n        {\n          $set: {\n            leaseExpiresAt: {\n              $dateAdd: {\n                startDate: '$$NOW',\n                unit: 'second',\n                amount: this.leaseSeconds,\n              },\n            },\n            updatedAt: '$$NOW',\n          },\n        },\n      ],\n      { returnDocument: 'after', updatePipeline: true },\n    );\n    return Boolean(updated);\n  }\n\n  private registerSchedule(): void {\n    if (!this.schedulerRegistry || this.scheduled) {\n      return;\n    }\n\n    const interval = setInterval(() => {\n      void this.reconcileOnce().catch(() => {\n        this.logger.warn(\n          'Scheduled auth identifier reconciliation pass failed',\n        );\n      });\n    }, this.intervalSeconds * 1000);\n    interval.unref();\n    this.schedulerRegistry.addInterval(SCHEDULE_NAME, interval);\n    this.scheduled = true;\n  }\n\n  private async runBoundedPass(): Promise<"+"AuthIdentifierReconciliationResult> {\n    const candidates = await this.operationModel\n      .find(  assignment: AuthIdentifierOperationAssignment,\n  ): Promise<"+"AuthIdentifierDocument | null> {\n    if (assignment.targetReservationId) {\n      return this.identifierModel.findById(assignment.targetReservationId);\n    }\n    return this.identifierModel.findOne({\n      pendingOperationId: operation.operationId,\n      subjectType: assignment.subjectType,\n      subjectId: assignment.subjectId,\n      pendingAction: String(assignment.action) as AuthIdentifierPendingAction,\n    });\n  }\n\n  private async transition(\n    operationId: string,\n    from: AuthIdentifierOperationStatus,\n    to: AuthIdentifierOperationStatus,\n  ): Promise<"+"void> {\n    if (from === to) {\n      return;\n    }\n    await this.operationModel.updateOne(\n      { operationId, status: from, leaseOwner: this.instanceId },\n      { $set: { status: to } },\n    );\n  }\n\n  private async releaseLease(operationId: string): Promise<"+"void> {\n    await this.operationModel.updateOne(\n      { operationId, leaseOwner: this.instanceId },\n      [\n        {\n          $set: { leaseExpiresAt: '$$NOW', updatedAt: '$$NOW' },\n        },\n      ],\n      { updatePipeline: true },\n    );\n  }\n\n  private correlationFor(\n    normalizedIdentifier: string,\n    requestedVersion?: number,\n  ): { hash: string; version: number } | undefined {\n    const version =\n      requestedVersion ??\n      this.configService.get<"+"number>(\n        'auth.auditCorrelationKeyRing.currentVersion',\n      ) ??\n      this.configService.get<"+"number>('auth.auditCorrelationKeyVersion');\n    if (!version) {\n      return undefined;\n    }\n    const material = this.keyPolicy.getKeyMaterial(version);\n    if (!material) {\n      return undefined;\n    }\n    const key = Buffer.isBuffer(material)\n      ? material\n      : this.decodeConfiguredSecret(material);\n    return {\n      hash: createHmac('sha256', key)\n        .update('book-library/auth-identifier-reconciliation/v1\\0')\n        .update(normalizedIdentifier)\n        .digest('base64url'),\n      version,\n    };\n  }\n\n  private decodeConfiguredSecret(value: string): Buffer {\n    const decoded = Buffer.from(value, 'base64url');\n    return decoded.toString('base64url') === value\n      ? decoded\n      : Buffer.from(value, 'utf8');\n  }\n\n  private get leaseSeconds(): number {\n    return (\n      this.configService.get<"+"number>('auth.identifierLeaseSeconds') ??\n      DEFAULT_LEASE_SECONDS\n    );\n  }\n\n  private get intervalSeconds(): number {\n    return (\n      this.configService.get<"+"number>(\n        'auth.identifierReconciliationIntervalSeconds',\n      ) ?? DEFAULT_INTERVAL_SECONDS\n    );\n  }\n\n  private get batchSize(): number {\n    return (\n      this.configService.get<"+"number>(\n        'auth.identifierReconciliationBatchSize',\n      ) ?? DEFAULT_BATCH_SIZE\n    );\n  }\n\n  private get retentionDays(): number {\n    return (\n      this.configService.get<"+"number>('auth.identifierOperationRetentionDays') ??\n      DEFAULT_RETENTION_DAYS\n    );\n  }\n\n  private get maxAssignments(): number {\n    return (\n      this.configService.get<"+"number>(\n        'auth.identifierMaxOperationAssignments',\n      ) ?? DEFAULT_MAX_ASSIGNMENTS\n    );\n  }\n}\n"}},"schemaVersion":"1.0","thresholds":{"high":80,"low":70,"break":70},"testFiles":{"src/auth/auth-identifier-reconciliation.service.spec.ts":{"tests":[{"id":"0","name":"AuthIdentifierReconciliationService checks a repair key before acquiring a lease and leaves data unchanged when missing","location":{"start":{"column":4,"line":130}}},{"id":"1","name":"AuthIdentifierReconciliationService claims an offline repair only when policy and key material are available","location":{"start":{"column":4,"line":155}}},{"id":"2","name":"AuthIdentifierReconciliationService skips an offline repair when policy allows but key material is absent","location":{"start":{"column":4,"line":182}}},{"id":"3","name":"AuthIdentifierReconciliationService uses the l ery matrix defers batch expiry when gated identifiers exhaust cleanup capacity","location":{"start":{"column":6,"line":2627}}},{"id":"82","name":"AuthIdentifierReconciliationService public recovery matrix keeps cleanup pending while gate or batch work remains","location":{"start":{"column":6,"line":2670}}},{"id":"83","name":"AuthIdentifierReconciliationService public recovery matrix completes empty cleanup remainder and applies retention only after terminal event fields exist","location":{"start":{"column":6,"line":2715}}},{"id":"84","name":"AuthIdentifierReconciliationService public recovery matrix releases every claimed lease when one public operation recovery fails","location":{"start":{"column":6,"line":2770}}}],"source":"import { Logger } from '@nestjs/common';\nimport { ConfigService } from '@nestjs/config';\nimport { SchedulerRegistry } from '@nestjs/schedule';\nimport { Connection, Types } from 'mongoose';\nimport {\n  createIdentifierModelHarness,\n  createStaffModelHarness,\n  deferred,\n  queryResult,\n} from '../../test/support/backend-coverage-fixtures';\nimport {\n  createIdentifierOperation,\n  criticalQueryResult,\n} from '../../test/support/critical-auth-fixtures';\nimport { AuthIdentifierReconciliationService } from './auth-identifier-reconciliation.service';\nimport { AuthIdentifierRepairKeyPolicyService } from './auth-identifier-repair-key-policy.service';\nimport {\n  AuthIdentifierAssignmentAction,\n  AuthIdentifierAssignmentStatus,\n  AuthIdentifierOperationCleanupStatus,\n  AuthIdentifierOperationResultOutcome,\n  AuthIdentifierOperationStatus,\n  AuthIdentifierOperationType,\n} from './schemas/auth-identifier-operation.schema';\nimport {\n  AuthIdentifierPendingAction,\n  AuthIdentifierStatus,\n  AuthIdentifierSubjectType,\n} from './schemas/auth-identifier.schema';\n\nconst staffRequester = createStaffModelHarness().document;\n\nfunction operation(overrides: Record<"+"string, unknown> = {}) {\n  return createIdentifierOperation({\n    operationId: 'operation-1',\n    requestedBy: {\n      subjectType: AuthIdentifierSubjectType.Staff,\n      subjectId: staffRequester._id.toString(),\n    },\n    ...overrides,\n  });\n}\n\nfunction assignment(overrides: Record<"+"string, unknown> = {}) {\n  return {\n    assignmentId: 'assignment-1',\n    subjectType: AuthIdentifierSubjectType.Member,\n    subjectId: 'member-1',\n    action: AuthIdentifierAssignmentAction.Claim,\n    status: AuthIdentifierAssignmentStatus.Pending,\n    ...overrides,\n  };\n}\n\ndescribe('AuthIdentifierReconciliationService', () => {\n  let operations: any;\n  let identifiers: any;\n  let batches: any;\n  let policy: Pick<"+"\n    AuthIdentifierRepairKeyPolicyService,\n    'repairWorkerDecision' | 'getKeyMaterial'\n  >;\n  let events: any;\n  let config: ConfigService;\n  let service: AuthIdentifierReconciliationService;\n\n  function createReconciliationService(overrides?: {\n    scheduler?: SchedulerRegistry;\n    connection?: Connection;\n    config?: ConfigService;\n    operations?: typeof operations;\n    identifiers?: typeof identifiers;\n    batches?: typeof batches;\n  }): AuthIdentifierReconciliationService {\n    return new AuthIdentifierReconciliationService(\n      overrides?.operations ?? operations,\n      overrides?.identifiers ?? identifiers,\n      overrides?.batches ?? batches,\n      policy as AuthIdentifierRepairKeyPolicyService,\n      events,\n      overrides?.config ?? config,\n      overrides?.scheduler,\n      overrides?.connection,\n    );\n  }\n\n  beforeEach(() => {\n    operations = {\n      find: jest.fn().mockReturnValue(criticalQueryResult([])),\n      findOneAndUpdate: jest.fn().mockResolvedValue(null),\n      updateOne: jest.fn().mockResolvedValue({ modifiedCount: 1 }),\n    };\n    const identifierHarness = createIdentifierModelHarness();\n    identifiers = {\n      ...identifierHarness.model,\n      find: jest.fn().mockReturnValue(criticalQueryResult([])),\n      findById: jest.fn().mockResolvedValue(null),\n      updateMany: jest.fn().mockResolvedValue({ modifiedCount: 0 }),\n      exists: jest.fn().mockResolvedValue(null),\n    };\n    batches = {\n      find: jest.fn().mockReturnValue(criticalQueryResult([])),\n      updateMany: jest.fn().mockResolvedValue({ modifiedCount: 0 }),\n      exists: jest.fn().mockResolvedValue(null),\n    };\n    policy = {\n      repairWorkerDecision: jest.fn().mockReturnValue({\n        allowed: true,\n        reason: 'ready',\n        requiredVersion: 1,\n      }),\n      getKeyMaterial: jest.fn().mockReturnValue('audit-key-material'),\n    };\n    events = {\n      recordIdentifierOperationTerminal: jest\n        .fn()\n        .mockResolvedValue('auth-identifier-operation:operation-1:completed'),\n    };\n    const values: Record<"+"string, number> = {\n      'auth.auditCorrelationKeyRing.currentVersion': 1,\n      'auth.identifierLeaseSeconds': 301,\n      'auth.identifierReconciliationBatchSize': 2,\n      'auth.identifierMaxOperationAssignments': 2,\n      'auth.identifierOperationRetentionDays': 91,\n    };\n    config = { get: (key: string) => values[key] } as ConfigService;\n    service = createReconciliationService();\n  });\n\n  it('checks a repair key before acquiring a lease and leaves data unchanged when missing', async () => {\n    operations.find.mockReturnValue(\n      criticalQueryResult([\n        operation({\n          operationType: AuthIdentifierOperationType.OfflineRepair,\n          manifestKeyVersion: 9,\n        }),\n      ]),\n    );\n    (policy.repairWorkerDecision as jest.Mock).mockReturnValue({\n      allowed: false,\n      reason: 'repair-key-required',\n      requiredVersion: 9,\n    });\n\n    await expect(service.reconcileOnce()).resolves.toMatchObject({\n      claimed: 0,\n      processed: 0,\n      skippedMissingKey: 1,\n    });\n    expect(operations.findOneAndUpdate).not.toHaveBeenCalled();\n    expect(operations.updateOne).not.toHaveBeenCalled();\n    expect(identifiers.updateOne).not.toHaveBeenCalled();\n  });\n\n  it('claims an offline repair only when policy and key material are available', async () => {\n    const offlineRepair = operation({\n      operationType: AuthIdentifierOperationType.OfflineRepair,\n      manifestKeyVersion: 1,\n      status: AuthIdentifierOperationStatus.Completed,\n      cleanupStatus: AuthIdentifierOperationCleanupStatus.Completed,\n    });\n    operations.find.mockReturnValue(criticalQueryResult([offlineRepair]));\n    operations.findOneAndUpdate.mockResolvedValue(offlineRepair);\n\n    await expect(service.reconcileOnce()).resolves.toMatchObject({\n      examined: 1,\n      claimed: 1,\n      processed: 1,\n      skippedMissingKey: 0,\n    });\n    expect(operations.findOneAndUpdate).toHaveBeenCalledTimes(1);\n    expect(operations.updateOne).toHaveBeenCalledWith(\n      {\n        operationId: offlineRepair.operationId,\n        leaseOwner: expect.any(String),\n      },\n      [{ $set: { leaseExpiresAt: '$$NOW', updatedAt: '$$NOW' } }],\n      { updatePipeline: true },\n    );\n  });\n\n  it('skips an offline repair when policy allows but key material is absent', async () => {\n    const offlineRepair = operation({\n      operationType: AuthIdentifierOperationType.OfflineRepair,\n      manifestKeyVersion: 1,\n    });\n    operations.find.mockReturnValue(criticalQueryResult([offlineRepair]));\n    (policy.getKeyMaterial as jest.Mock).mockReturnValue(undefined);\n\n    await expect(service.reconcileOnce()).resolves.toEqual({\n      examined: 1,\n      claimed: 0,\n      processed: 0,\n      skippedMissingKey: 1,\n    });\n    expect(operations.findOneAndUpdate).not.toHaveBeenCalled();\n    expect(operations.updateOne).not.toHaveBeenCalled();\n  });\n\n  it.each([\n    [\n      'canonical base64url',\n      'AQID',\n      'lEM1oM_GJ_Uo74k0Uuo-fbm3ITclnSJY35gtRSJFOfg',\n    ],\n    [\n      'literal UTF-8',\n      'not base64!',\n      'wSOLmzFyV-NqjUmHROCdyQ18-fQ0sMfKBioXPTtkDno',\n    ],\n  ])(\n    'uses the legacy key
